name: Update KML shapes and beat list

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}        # "Run workflow" button for an immediate update
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/kml.yml']

permissions:
  contents: write

concurrency:
  group: kml
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/build-kml.mjs
      - run: node scripts/build-beats.mjs
      - name: Commit if changed
        run: |
          git add kml/ assets/beats.json
          if git diff --cached --quiet; then echo "No KML changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update KML shapes / beat list from Google Drive"
          git push
