name: selftest
on: { push: { branches: [main], paths: ['.github/workflows/selftest.yml'] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > t.mjs <<'X'
          const UA={'User-Agent':'Mozilla/5.0 (civil-works-site build)'};
          const r=await fetch('https://drive.google.com/uc?export=download&id=1cBo8aB_MrAyxbSf3pgCR-smBzBG_OKXb',{headers:UA});
          const b=new Uint8Array(await r.arrayBuffer());console.log('DL',r.status,r.headers.get('content-type'),b.length,b[0],b[1]);
          const h=await (await fetch('https://drive.google.com/embeddedfolderview?id=1bGTxzjS1F13fwUKfeOcrDzmjkp-NX5Wi',{headers:UA})).text();
          const re=/\/file\/d\/([-\w]{20,})\/[^"]*"[\s\S]*?flip-entry-title">([^<]+)</g;let m,n=0,first;while((m=re.exec(h))){n++;first=first||m[2]+' '+m[1]}
          console.log('FOLDER',h.length,n,first);
          X
          node t.mjs
